name: Audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - .github/workflows/audit.yml

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Supply-chain gate: fail on any RustSec advisory (vulnerability, unmaintained,
  # unsound, or yanked) in the dependency tree. Accepted transitive advisories are
  # listed with a reason in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit --deny warnings
